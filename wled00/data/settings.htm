<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
	<link rel="icon" href="favicon.ico">
	<link rel="apple-touch-icon" href="favicon.ico">
	<title>Loomx Node Settings</title>
	<script>
		// load common.js with retry on error
		(function loadFiles() {
			const l = document.createElement('script');
			l.src = 'common.js';
			// note: loading style.css here causes ugly white button flashes so @import url("style.css") below inlines it for this page (only costs ~30bytes of flash)
			l.onload = () => {
				getLoc();
				loadJS(getURL('/settings/s.js?p=0'), false);
			};
			l.onerror = () => setTimeout(loadFiles, 100);
			document.head.appendChild(l);
		})();
	</script>
	<style>
		@import url("style.css");
		body {
			height: 100px;
			margin: 0 auto;
			max-width: 520px;
		}
		html {
			--h: 9vh;
		}
		button {
			display: block;
			border-radius: var(--h);
			font-size: clamp(1rem, 6vw, 2rem);
			height: var(--h);
			width: calc(100% - 40px);
			margin: 2vh auto 0;
			padding: 0;
		}
		.loomx-settings-brand {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			height: 56px;
			margin-top: 8px;
		}
		.loomx-settings-brand svg {
			width: 162px;
			max-width: 42vw;
			height: auto;
		}
	</style>
</head>
